<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To Do</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <img class="logo" src="icon.svg" alt="">
    <span class="brand">To <span>Do</span></span>
  </header>

  <div class="app" id="app" data-screen="menu">
    <nav class="menu" aria-label="목록">
      <ul id="smart-lists"></ul>
      <ul id="my-lists"></ul>
      <input id="new-list" placeholder="새 목록" aria-label="새 목록 이름">
    </nav>

    <main class="tasks">
      <button id="back" type="button">← 목록</button>
      <div class="title-row">
        <div>
          <h1 id="list-title"></h1>
          <p id="list-sub" hidden></p>
        </div>
        <div class="actions">
          <div class="sort-wrap">
            <button id="sort" type="button" aria-haspopup="true">정렬</button>
            <ul id="sort-menu" hidden></ul>
          </div>
          <button id="delete-list" type="button">목록 삭제</button>
        </div>
      </div>
      <div class="view-toggle" role="group" aria-label="보기 방식">
        <button id="view-list" type="button">목록</button>
        <button id="view-calendar" type="button">달력</button>
      </div>

      <div id="list-view">
        <input id="item" placeholder="작업 추가" aria-label="작업 추가">
        <p id="empty">할 일이 없어요</p>
        <ul id="list"></ul>
        <h2 id="done-title">
          <button id="done-toggle" type="button" aria-expanded="false"><span id="done-arrow">▸</span> 완료됨 (<span id="done-count">0</span>)</button>
        </h2>
        <ul id="done-list"></ul>
      </div>

      <section id="calendar-view" hidden aria-label="달력">
        <div class="cal-head">
          <button id="cal-prev" type="button" aria-label="이전 달">‹</button>
          <strong id="cal-title"></strong>
          <button id="cal-next" type="button" aria-label="다음 달">›</button>
          <button id="cal-today" type="button">오늘</button>
        </div>
        <div class="cal-grid cal-weekdays">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
        <p id="cal-nodue" hidden></p>
        <h2 id="day-title"></h2>
        <ul id="day-list"></ul>
        <p id="day-empty" hidden>이 날은 마감인 할 일이 없어요</p>
      </section>
    </main>

    <aside class="detail" id="detail" hidden aria-label="세부 창">
      <button id="detail-back" type="button">← 돌아가기</button>
      <div class="title-row">
        <input id="detail-title" aria-label="제목">
        <button id="detail-star" type="button">☆</button>
      </div>
      <ul id="steps"></ul>
      <input id="new-step" placeholder="단계 추가" aria-label="단계 추가">
      <button id="my-day-toggle" type="button">오늘 하루에 추가</button>
      <div class="field">
        <label for="due">마감일</label>
        <input id="due" type="date">
        <button id="due-clear" type="button">지우기</button>
      </div>
      <div class="field">
        <label for="repeat">반복</label>
        <select id="repeat">
          <option value="">안 함</option>
          <option value="daily">매일</option>
          <option value="weekdays">평일</option>
          <option value="weekly">매주</option>
          <option value="monthly">매월</option>
          <option value="yearly">매년</option>
        </select>
      </div>
      <textarea id="note" placeholder="메모 추가" aria-label="메모" rows="5"></textarea>
      <button id="delete-task" type="button">할 일 삭제</button>
    </aside>
  </div>
  <script src="script.js"></script>
</body>
</html>
